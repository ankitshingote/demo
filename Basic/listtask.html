<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list task</title>
    <style>
        ul{
            font-size: 25px;
            }
            ol{
                font-size: 25px;
            }
    </style>
</head>
<body>
    <ul type="square" >
        <li>1</li>
    </ul>
    <ul type="circle">
        <li>2</li></ul>
        <ol >
            <li>3</li>
            <li>4</li>
            
        </ol>
        <ol start="3">
            <li>5</li>
            <li>6</li>
        </ol>
        <ol start="1" type="A" reversed>
            <li>7</li>
            <li>8</li>
            <li>9</li>
        </ol>
        <ul >
            <li>10</li>
        </ul>
        <ol type="i" start="2">
            <li>11</li>
        </ol>
        <ul type="none">
            <li>12</li>
        </ul>
        <ol type="I" start="2">
            <li>13</li>
            <li>14</li>
        </ol>
    
</body>
</html>
