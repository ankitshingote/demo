<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nested list</title>
    <style>
        ol{
            font-size:25px;
        }
        ul{
            font-size: 25px;
        }
    </style>
</head>
<body>
    <h2>Nested list</h2>
    <ol>
        <li>Front-end</li>
        <ul>
               <li>html</li>
                <li>css</li>
                <li>js</li>
                     </ul>
                     <li>backend</li>
                     <ul>
                        <li>java</li>
                        <li>jdbs</li>
                        <li>sql</li>
                     </ul>
    </ol>
</body>
</html>
